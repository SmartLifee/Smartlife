<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLife - Jugaad Tech & Life Solutions</title>
    <meta name="keywords" content="AI Hindi, mobile repair India, Ayurveda remedies, Indian life hacks, tech solutions India">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #2d3436;
            --primary: #6c5ce7;  /* Purple - culturally significant color */
            --secondary: #ffffff;
            --accent: #FF9933;   /* Saffron - Indian national color */
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #ffffff;
            --primary: #7c6cf7;
            --secondary: #2d2d2d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif; /* Better for Indian languages */
            transition: 0.3s all;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Floating Diyas Animation */
        .floating-balls {
            position: fixed;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        .ball {
            position: absolute;
            background: rgba(255, 153, 51, 0.2); /* Saffron color */
            border-radius: 50%;
            filter: blur(35px);
            animation: float 6s infinite linear;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(200px, 150px) scale(1.2); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* Header with Indian Touch */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            border-bottom: 3px solid var(--accent);
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(45deg, #6c5ce7, #FF9933);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: 'Montserrat', sans-serif;
        }

        /* Search Section with Indian Style */
        .search-section {
            text-align: center;
            padding: 3rem 1rem 2rem;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0,0 L30,10 L65,0 L100,10" fill="none" stroke="%236c5ce7" stroke-width="0.5"/></svg>') bottom no-repeat;
            background-size: 100% 10px;
        }

        .search-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .search-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        input[type="search"] {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border: 2px solid var(--primary);
            border-radius: 30px;
            font-size: 1.1rem;
            background: var(--secondary);
            box-shadow: 0 2px 10px rgba(108, 92, 231, 0.1);
        }

        .keywords {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .keyword {
            padding: 0.6rem 1.2rem;
            background: var(--primary);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .keyword:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        /* Blog System with Indian Card Style */
        .blog-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
        }

        .blog-card {
            background: var(--secondary);
            border-radius: 12px;
            padding: 1.8rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: all 0.3s;
            border-top: 3px solid var(--accent);
            position: relative;
            overflow: hidden;
        }

        .blog-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }

        .blog-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.2);
        }

        /* Full Blog View with Indian Theme */
        .blog-content {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            padding: 5rem 2rem;
            overflow-y: auto;
            z-index: 2000;
        }

        .blog-content-inner {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        /* AI Typing Effect with Hindi Support */
        .typing-effect {
            border-right: 2px solid var(--primary);
            animation: typing 1s steps(40) infinite;
        }

        @keyframes typing {
            from { border-color: transparent; }
            50% { border-color: var(--primary); }
            to { border-color: transparent; }
        }

        /* Hidden SEO Hashtags */
        .seo-keywords {
            position: absolute;
            left: -9999px;
            color: transparent;
        }

        /* Pagination with Indian Style */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 3rem 0;
            padding: 0 1rem;
        }

        .pagination button {
            padding: 0.8rem 1.8rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .pagination button:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        /* Dark Mode Toggle as Diya */
        .theme-toggle {
            position: fixed;
            top: 0.8rem;
            right: 2rem;
            background: var(--primary);
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
            background: var(--accent);
        }

        /* Back Button as Lotus */
        .back-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--primary);
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 2001;
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .back-btn:hover {
            transform: scale(1.1);
            background: var(--accent);
        }

        /* Indian Language Support */
        .hindi-font {
            font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .logo {
                font-size: 1.8rem;
            }
            .search-box {
                flex-direction: column;
            }
            .blog-container {
                grid-template-columns: 1fr;
            }
            .keyword {
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
</head>

                ball.style.top = Math.random() * 100 + 'vh';

        // Shuffle Blogs with Indian Algorithm (Fisher-Yates)
        function shuffleBlogs() {
            for(let i = blogs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [blogs[i], blogs[j]] = [blogs[j], blogs[i]];
            }
            // Additional Indian touch - prioritize local content sometimes
            if(Math.random() > 0.7) {
                blogs.sort((a,b) => a.title.includes('भारत') || a.title.includes('हिंदी') ? -1 : 1);
            }
        }

        // Pagination with Indian Number Formatting
        let currentPage = 1;
        const blogsPerPage = 4;

        function renderBlogs() {
            const container = document.getElementById('blogContainer');
            container.innerHTML = '';
            
            const start = (currentPage - 1) * blogsPerPage;
            const end = start + blogsPerPage;
            
            blogs.slice(start, end).forEach(blog => {
                const card = document.createElement('div');
                card.className = 'blog-card';
                card.innerHTML = `
                    <h2 class="${blog.title.match(/[\u0900-\u097F]/) ? 'hindi-font' : ''}">${blog.title}</h2>
                    <p class="${blog.content.match(/[\u0900-\u097F]/) ? 'hindi-font' : ''}">${blog.content.split('\n')[0]}...</p>
                    <div style="margin-top: 1rem; color: var(--primary); font-weight: 500;">${blog.category}</div>
                    <button onclick="openBlog('${blog.title}')" style="margin-top: 1rem; padding: 0.6rem 1.2rem; background: var(--primary); color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: 500;">पूरा पढ़ें</button>
                    <div class="seo-keywords">${blog.keywords}</div>
                `;
                container.appendChild(card);
            });

            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = end >= blogs.length;
        }

        function changePage(direction) {
            currentPage += direction;
            renderBlogs();
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // AI Writing Effect with Indian Speed
        function simulateAIWriting(element, text) {
            let index = 0;
            element.innerHTML = '';
            const cursor = document.createElement('span');
            cursor.className = 'typing-effect';
            
            // Faster typing for Indian users (cultural preference)
            const typingSpeed = text.match(/[\u0900-\u097F]/) ? 15 : 20;
            
            const interval = setInterval(() => {
                if(index < text.length) {
                    element.innerHTML = text.substring(0, index)
                        .replace(/\n/g, '<br>')
                        .replace(/(\d+\.)/g, '<strong>$1</strong>');
                    element.appendChild(cursor);
                    index++;
                } else {
                    clearInterval(interval);
                    element.removeChild(cursor);
                }
            }, typingSpeed);
        }

        // Blog Navigation with Indian Style
        function openBlog(title) {
            const blog = blogs.find(b => b.title === title);
            const contentDiv = document.getElementById('blogContentInner');
            document.getElementById('blogContent').style.display = 'block';
            document.body.style.overflow = 'hidden';
            
            contentDiv.innerHTML = `
                <h1 class="${title.match(/[\u0900-\u097F]/) ? 'hindi-font' : ''}">${title}</h1>
                <div id="aiContent" style="margin-top: 2rem; line-height: 1.8; font-size: 1.1rem;"></div>
                <div class="seo-keywords">${blog.keywords}</div>
            `;
            
            simulateAIWriting(document.getElementById('aiContent'), blog.content);
        }

        function closeBlog() {
            document.getElementById('blogContent').style.display = 'none';
            document.body.style.overflow = 'auto';
            shuffleBlogs();
            renderBlogs();
        }

        // Search Functionality with Hindi Support
        document.getElementById('searchBtn').addEventListener('click', searchBlogs);
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') searchBlogs();
        });

        function searchBlogs() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = blogs.filter(blog => 
                blog.title.toLowerCase().includes(term) || 
                blog.content.toLowerCase().includes(term) ||
                blog.keywords.toLowerCase().includes(term) ||
                blog.category.toLowerCase().includes(term)
            );
            
            if(filtered.length > 0) {
                // Temporarily use filtered blogs with Indian-style notification
                const originalBlogs = [...blogs];
                blogs.length = 0;
                blogs.push(...filtered);
                currentPage = 1;
                renderBlogs();
                
                // Show Indian-style toast notification
                const toast = document.createElement('div');
                toast.textContent = filtered.length + ' परिणाम मिले';
                toast.style.position = 'fixed';
                toast.style.bottom = '80px';
                toast.style.left = '50%';
                toast.style.transform = 'translateX(-50%)';
                toast.style.background = 'var(--primary)';
                toast.style.color = 'white';
                toast.style.padding = '10px 20px';
                toast.style.borderRadius = '25px';
                toast.style.boxShadow = '0 3px 10px rgba(0,0,0,0.2)';
                toast.style.zIndex = '3000';
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.5s';
                    setTimeout(() => toast.remove(), 500);
                }, 2000);
                
                // Restore original after delay
                setTimeout(() => {
                    blogs.length = 0;
                    blogs.push(...originalBlogs);
                }, 5000);
            }
        }

        // Category Filter with Indian Touch
        document.querySelectorAll('.keyword').forEach(btn => {
            if(btn.id !== 'searchBtn') {
                btn.addEventListener('click', () => {
                    const category = btn.dataset.category;
                    const filtered = blogs.filter(blog => blog.category === category);
                    const originalBlogs = [...blogs];
                    blogs.length = 0;
                    blogs.push(...filtered);
                    currentPage = 1;
                    renderBlogs();
                    
                    // Add Indian-style visual feedback
                    btn.style.transform = 'scale(1.1)';
                    btn.style.background = 'var(--accent)';
                    setTimeout(() => {
                        btn.style.transform = '';
                        btn.style.background = 'var(--primary)';
                    }, 300);
                    
                    setTimeout(() => {
                        blogs.length = 0;
                        blogs.push(...originalBlogs);
                    }, 5000);
                });
            }
        });

        // Initialize with Indian Timezone
        function init() {
            createBalls();
            shuffleBlogs();
            renderBlogs();
            
            // Set Indian time format if needed
            if(typeof Intl !== 'undefined') {
                const timeEl = document.createElement('div');
                timeEl.style.position = 'fixed';
                timeEl.style.bottom = '80px';
                timeEl.style.left = '20px';
                timeEl.style.zIndex = '1000';
                timeEl.style.fontSize = '0.8rem';
                timeEl.style.opacity = '0.7';
                timeEl.textContent = new Date().toLocaleString('en-IN', {
                    timeZone: 'Asia/Kolkata'
                });
                document.body.appendChild(timeEl);
                setInterval(() => {
                    timeEl.textContent = new Date().toLocaleString('en-IN', {
                        timeZone: 'Asia/Kolkata'
                    });
                }, 60000);
            }
        }

        // Event Listeners with Indian Names
        document.getElementById('prevBtn').addEventListener('click', () => changePage(-1));
        document.getElementById('nextBtn').addEventListener('click', () => changePage(1));

        // Start with Indian Context
        document.addEventListener('DOMContentLoaded', init);
